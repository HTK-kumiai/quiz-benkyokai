            let history = [];
            let position = -1;
            let unseen = new Set(allQuestions.map((q) => q.id));

            function render() {
                const q = allQuestions.find((x) => x.id === history[position]);
                document.getElementById("meta").textContent = "Soal #" + q.id;
                document.getElementById("question").textContent = q.question;
                document.getElementById("reading").textContent =
                    q.reading || "";
                document.getElementById("answer").textContent = q.answer
                    ? "Jawaban sumber: " + q.answer
                    : "Jawaban sumber tidak terbaca pada bagian kunci jawaban PDF.";
                document.getElementById("answer").style.display = "none";
                document.getElementById("back").disabled = position <= 0;
                document.getElementById("progress").textContent =
                    "Sudah muncul: " +
                    history.length +
                    " / " +
                    allQuestions.length;
            }

            function nextQuestion() {
                if (position < history.length - 1) {
                    position++;
                    render();
                    return;
                }
                if (unseen.size === 0) {
                    alert("Semua soal sudah muncul dalam sesi ini.");
                    return;
                }
                const arr = [...unseen];
                const id = arr[Math.floor(Math.random() * arr.length)];
                unseen.delete(id);
                history.push(id);
                position++;
                render();
            }

            document.getElementById("next").onclick = nextQuestion;
            document.getElementById("back").onclick = () => {
                if (position > 0) {
                    position--;
                    render();
                }
            };
