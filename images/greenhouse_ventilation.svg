<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="url(#skyGrad)"/>
  <rect y="220" width="500" height="80" fill="#86efac"/>
  <rect y="240" width="500" height="60" fill="#4ade80"/>
  
  <!-- Sun -->
  <circle cx="430" cy="50" r="28" fill="#facc15" stroke="#eab308" stroke-width="3"/>
  
  <!-- Greenhouse Main Frame -->
  <!-- Back Glass -->
  <polygon points="100,180 250,90 400,180 370,230 130,230" fill="url(#glassGrad)" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Front Greenhouse Structure -->
  <polygon points="70,190 250,80 430,190 400,240 100,240" fill="url(#glassGrad)" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="250" y1="80" x2="250" y2="240" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="160" y1="135" x2="160" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="340" y1="135" x2="340" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Roof Ventilation (天窓 / Tensou) - OPEN -->
  <g id="tensou">
    <polygon points="210,105 250,80 250,60 210,85" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="210" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">天窓 (てんそう / Atap)</text>
    <path d="M 230,45 L 240,65" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Side Ventilation (側窓 / Sokusou) - OPEN -->
  <g id="sokusou">
    <rect x="75" y="195" width="40" height="35" fill="#fef08a" stroke="#ca8a04" stroke-width="2" transform="rotate(-10 75 195)"/>
    <text x="30" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">側窓 (そくそう / Samping)</text>
  </g>
  
  <!-- Plants Inside -->
  <g fill="#15803d">
    <circle cx="160" cy="225" r="10"/>
    <circle cx="210" cy="225" r="12"/>
    <circle cx="250" cy="225" r="14"/>
    <circle cx="290" cy="225" r="12"/>
    <circle cx="340" cy="225" r="10"/>
  </g>
  
  <!-- Air Flow Arrows -->
  <path d="M 90,200 Q 150,170 230,85" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="170" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">【温室の換気 (Sirkulasi Udara Rumah Kaca)】</text>
</svg>
